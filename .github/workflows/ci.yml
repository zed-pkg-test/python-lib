name: package CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ci.yml

      - name: Verify Zed and project metadata agree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as handle:
              project = tomllib.load(handle)["project"]
          with Path(".zpkg.toml").open("rb") as handle:
              zed = tomllib.load(handle)["package"]

          # PyPI names cannot carry a scope, so the convention is the flattened
          # "<org>-<name>"; drift here means pip and zed disagree on identity.
          assert project["name"] == f"{zed['org']}-{zed['name']}", project["name"]
          assert project["version"] == zed["version"], project["version"]
          assert project["description"] == zed["description"]
          assert project["license"]["text"] == zed["license"]
          assert project["readme"] == "README.md"
          assert project["urls"]["Repository"] == zed["repository"]["url"]
          assert zed["org"] == "zed-pkg-test", zed["org"]
          PY

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"

      - name: Test the package
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -t . -v

      - name: Audit built wheel contents
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          wheel="$(find "$RUNNER_TEMP/dist" -name '*.whl' -print -quit)"
          test -n "$wheel"
          python - "$wheel" > "$RUNNER_TEMP/wheel-files.txt" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              for name in sorted(archive.namelist()):
                  print(name)
          PY
          cat "$RUNNER_TEMP/wheel-files.txt"
          grep -Fxq python_lib/__init__.py "$RUNNER_TEMP/wheel-files.txt"
          # Local and test state must not ride along inside the distribution.
          if grep -Eq '(^|/)(tests|__pycache__|\.zed)/|(^|/)\.zpkg\.toml$' "$RUNNER_TEMP/wheel-files.txt"; then
            echo "local/test state leaked into the wheel" >&2
            exit 1
          fi

      - name: Upload package-content diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-wheel-files
          path: ${{ runner.temp }}/wheel-files.txt
          if-no-files-found: warn
          retention-days: 7
